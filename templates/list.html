<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メモ一覧画面</title>
</head>
<body>
    <h1>メモ一覧</h1>

    <a href="/">新しいメモを登録する</a>

    <br><br>

    {% for memo in memos %}
        <p>
            ID：{{ memo['id'] }}／
            タイトル：{{ memo['title'] }}／
            日付：{{ memo['date'] }}／
            <a href="/detail/{{ memo['id'] }}">詳細を見る</a>
        </p>
    {% endfor %}
</body>
</html>
